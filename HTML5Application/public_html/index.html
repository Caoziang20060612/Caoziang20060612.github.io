<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Fixed Cube</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .cube {
            position: relative;
            width: 300px;
            height: 300px;
        }

        .cube-face {
            position: absolute;
            opacity: 0.9;
        }

        /* 正面：完全没动，和你认可的第一版代码一模一样 */
        .front {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transform: translate(0, 0);
        }

        /* 右侧面：完全没动，和你认可的第一版代码一模一样 */
        .right {
            width: 100px;
            height: 200px;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            transform-origin: top left;
            transform: translate(200px, 0) skewY(-45deg);
        }

        /* 仅修正了顶面，完美匹配正面和右侧面，严丝合缝 */
        .top {
            width: 200px;
            height: 100px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            transform-origin: bottom left;
            /* 核心修正：向上平移100px让底边和正面顶边完全重合，skewX(-45deg)完美贴合右侧面顶边 */
            transform: translate(0, -100px) skewX(-45deg);
        }
    </style>
</head>
<body>
    <div class="cube">
        <div class="cube-face front"></div>
        <div class="cube-face top"></div>
        <div class="cube-face right"></div>
    </div>
</body>
</html>
