<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Cube | Gradient Faces + Transform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            padding: 20px;
        }

        .cube-container {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 25px 25px rgba(0, 0, 0, 0.4));
        }

        .face {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 8px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.1), 0 5px 12px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
            pointer-events: none;
        }

        .face::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: inherit;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25) inset;
            pointer-events: none;
        }

        .front {
            background: linear-gradient(135deg, #FFB347, #FF6B6B, #FF3B3F);
            background-size: 150% 150%;
            transform: translate(0px, 0px);
            z-index: 2;
        }

        .right {
            background: linear-gradient(225deg, #1A2980, #26D0CE);
            background-size: 120% 120%;
            transform: skewY(-30deg) translateX(200px) translateY(-18px);
            z-index: 1;
        }

        .top {
            background: linear-gradient(45deg, #AA076B, #61045F, #4A00E0);
            background-size: 140% 140%;
            transform: skewX(-30deg) translateY(-200px) translateX(36px);
            z-index: 0;
        }

        @keyframes subtleFloat {
            0% {
                transform: translateY(0px);
            }
            100% {
                transform: translateY(-6px);
            }
        }

        .cube-container {
            animation: subtleFloat 2.5s infinite alternate ease-in-out;
        }

        .cube-container:hover .face {
            filter: brightness(1.02) saturate(1.05);
            transition: filter 0.25s;
        }

        .cube-container:hover {
            animation-play-state: paused;
            transform: scale(1.02);
        }

        @media (max-width: 550px) {
            .cube-container {
                transform: scale(0.85);
            }
        }

        .cube-container::before {
            content: '';
            position: absolute;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(255,215,150,0.2) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            filter: blur(20px);
        }
    </style>
</head>
<body>
<div class="cube-container">
    <div class="face front" style="transform: translate(0px, 0px);"></div>
    <div class="face right"></div>
    <div class="face top"></div>
</div>
</body>
</html>
